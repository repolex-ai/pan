# pand — the Pan daemon. One per machine; this file is its whole configuration.
# Copy to ~/.config/pan/config.yml and edit. Every line below is required
# unless it says otherwise.

# Stores. A soul repo keeps its store at <repo>/.pan and its id is the first
# six characters of the repo's genesis SHA, e.g. 700c5b. A plain directory is
# its own store and names itself in its pan.yml.
stores:
  - ~/.pan
default: ~/.pan

# Media lives off the system drive: <media_volume>/<id>/pan
media_volume: /Volumes/f00/_pan

port: 7401
batch: 4
interval_secs: 5

models:
  caption:
    url: http://127.0.0.1:1215/percept/vlm
    # THE NAME. One name for this model, everywhere Pan says which model did
    # something: the graph, the file, the file name, the log line. Lowercase
    # letters, digits and single dashes — no periods, no spaces, no slashes.
    model: qwen3-8-27b
    # THE PROMPT. REQUIRED, and it names the file. Prompts live in one flat
    # folder, ~/.config/pan/prompts/. A name ending .default.md is one Pan
    # ships and rewrites when it ships a new version; every other name is
    # yours and Pan never writes it. To change a prompt, copy it under a name
    # of your own and put that name here. pand refuses to start without this
    # line.
    prompt: full-caption.default.md
    # Sent verbatim in the provider's request body; Pan has no opinion about
    # what is in here. Optional.
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
      max_tokens: 1024
    concurrency: 2
    enabled: true
  embed:
    url: http://127.0.0.1:1215/percept/embed
    model: qwen3-vl-embedding-2b
    concurrency: 2
    enabled: true
  pose:
    url: http://127.0.0.1:1215/percept/pose
    model: rtmw-x-l
    concurrency: 2
    enabled: true
  depth:
    url: http://127.0.0.1:1215/percept/depth
    model: depth-anything-v2-base
    concurrency: 2
    enabled: true
  segment:
    url: http://127.0.0.1:1215/percept/segment
    model: sam3
    # Nouns this stage asks for on EVERY image, on top of whatever the caption
    # model listed. Without them, a photograph of people whose caption never
    # said "person" comes back with no person region. Optional; omit for the
    # caption's nouns alone.
    always: person, face
    # What the segmentation node is told besides the image. The node's own
    # defaults are 0.4 and 16; Pan sends these so the numbers that shaped a
    # result are recorded with it.
    min_confidence: 0.4
    polygon_verts: 16
    concurrency: 2
    enabled: true
